[package]
name = "rime_ls"
version = "0.4.3"
edition = "2024"
authors = ["ZilcH40 <wlh233@live.com>"]
rust-version = "1.85"

[[bin]]
name = "rime-ls"
path = "src/main.rs"

[[bin]]
name = "rrg"
path = "src/bin/rg/main.rs"

[dependencies]
librime-sys = { version = "0.1.0", git = "https://github.com/lotem/librime-sys" }
notify = "6"
notify-debouncer-mini = "0.4"
dashmap = "5.5"
regex = "1.12"
ropey = "1.6"
tokio = { version = "1", features = ["io-util", "io-std", "macros", "rt-multi-thread", "net", "signal", "time"] }
tower-lsp = "0.20.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
directories = "5"
ouroboros = "0.18"
thiserror = "1"
once_cell = "1.21"
chrono = "0.4"
jieba-rs = "0.8"
libc = "0.2"
pinyin = "0.11"

[features]
default = []
no_log_dir = [] # for librime < 1.6

[profile.release]
strip = true
lto = true
codegen-units = 1

# Use vendored librime-sys with Homebrew auto-detection
[patch."https://github.com/lotem/librime-sys"]
librime-sys = { path = "vendor/librime-sys" }
